name: Release Linux AMD64 DEB

on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].*'

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev rubygems build-essential capnproto
          gem install fpm

      - name: Build cloudflared
        run: make cloudflared

      - name: Build DEB package
        run: make cloudflared-deb

      - name: Rename to match official naming
        run: mv cloudflared_*.deb cloudflared-linux-amd64.deb

      - name: Upload DEB to Release
        uses: softprops/action-gh-release@v2
        with:
          files: cloudflared-linux-amd64.deb
          generate_release_notes: true
